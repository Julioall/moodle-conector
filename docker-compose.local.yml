services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: moodle-connector:local
    container_name: moodle-connector-local-app
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Features__PortalV2Enabled: "true"
      Postgres__ConnectionString: Host=postgres;Database=moodle_connector;Username=moodle_connector;Password=portal-local-only
      ConnectorSecrets__EncryptionKeyBase64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      MoodleApi__UseStubData: "true"
      MoodleProxy__UseStubData: "true"
    ports:
      - "8787:8080"
    volumes:
      - portal-local-app-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: moodle-connector-local-postgres
    environment:
      POSTGRES_DB: moodle_connector
      POSTGRES_USER: moodle_connector
      POSTGRES_PASSWORD: portal-local-only
    volumes:
      - portal-local-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle_connector -d moodle_connector"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  portal-local-app-data:
  portal-local-postgres-data:
