name: App v2 CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app-and-connector:
    runs-on: ubuntu-latest
    env:
      MOODLE_CONNECTOR_POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Database=moodle_connector_ci;Username=moodle_connector;Password=ci-postgres-password
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: moodle_connector_ci
          POSTGRES_USER: moodle_connector
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moodle_connector -d moodle_connector_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/MoodleConnector.Web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify App Web
        working-directory: src/MoodleConnector.Web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Verify Connector
        run: |
          dotnet restore MoodleConnector.slnx
          dotnet build MoodleConnector.slnx --no-restore
          dotnet test MoodleConnector.slnx --no-build --no-restore
      - name: Validate Plugin Package
        shell: pwsh
        run: ./scripts/validate-plugin.ps1
      - name: Validate Generated Submission Tools
        shell: pwsh
        run: ./scripts/generate-chatgpt-app-submission.ps1 -Check
      - name: Validate Packaged Skills
        run: python plugins/moodle-connector/skills/moodle-core/scripts/check_skill_catalog.py --repo-root .
      - name: Validate Documentation
        shell: pwsh
        run: ./scripts/check-documentation.ps1
      - name: Verify Production Container
        run: docker build --tag moodle-connector-app-v2-ci .
      - name: Validate Caddy topology
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -e APP_DOMAIN=moodle-connector.localhost caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

