name: Production account maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Safe maintenance operation
        required: true
        type: choice
        options:
          - inspect
          - link_goias_readonly
        default: inspect
      confirmation:
        description: Type LINK_SINGLE_ACCOUNT_GOIAS_READONLY for the link operation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: vps-moodle-connector-maintenance
  cancel-in-progress: false

env:
  VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/moodle-connector' }}
  VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
  APP_PORT: ${{ vars.APP_PORT || '8787' }}
  POSTGRES_DB: ${{ vars.POSTGRES_DB || 'moodle_connector' }}
  POSTGRES_USER: ${{ vars.POSTGRES_USER || 'moodle_connector' }}
  VPS_AUTH_SECRET: ${{ secrets.VPS_SSH_KEY }}

jobs:
  maintain:
    name: Inspect or link the single account
    runs-on: ubuntu-latest
    environment: moodle-connector

    steps:
      - name: Validate request
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          TEMP_MOODLE_USERNAME: ${{ secrets.TEMP_MOODLE_USERNAME }}
          TEMP_MOODLE_PASSWORD: ${{ secrets.TEMP_MOODLE_PASSWORD }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${{ secrets.VPS_HOST }}" || (echo "::error::Configure VPS_HOST" && exit 1)
          test -n "${{ secrets.VPS_USER }}" || (echo "::error::Configure VPS_USER" && exit 1)
          test -n "$VPS_AUTH_SECRET" || (echo "::error::Configure VPS_SSH_KEY" && exit 1)

          if [ "$OPERATION" = "link_goias_readonly" ]; then
            [ "$CONFIRMATION" = "LINK_SINGLE_ACCOUNT_GOIAS_READONLY" ] ||
              (echo "::error::Invalid confirmation text" && exit 1)
            test -n "$TEMP_MOODLE_USERNAME" ||
              (echo "::error::Configure TEMP_MOODLE_USERNAME in the moodle-connector environment" && exit 1)
            test -n "$TEMP_MOODLE_PASSWORD" ||
              (echo "::error::Configure TEMP_MOODLE_PASSWORD in the moodle-connector environment" && exit 1)
            test -n "$ADMIN_API_KEY" ||
              (echo "::error::Configure ADMIN_API_KEY in the moodle-connector environment" && exit 1)
          fi

      - name: Configure SSH
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rsync
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_SSH_PORT" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

          if printf '%s' "$VPS_AUTH_SECRET" | grep -q "BEGIN .*PRIVATE KEY"; then
            printf '%s\n' "$VPS_AUTH_SECRET" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            echo "VPS_AUTH_MODE=key" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y sshpass
            echo "VPS_AUTH_MODE=password" >> "$GITHUB_ENV"
          fi

      - name: Inspect sanitized account state
        if: inputs.operation == 'inspect'
        run: |
          set -euo pipefail
          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -euo pipefail
          POSTGRES_USER="$1"
          POSTGRES_DB="$2"
          DOCKER='docker'
          if ! docker info >/dev/null 2>&1; then DOCKER='sudo docker'; fi
          USERS=$($DOCKER exec moodle-connector-postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc \
            'SELECT count(*) FROM user_accounts;')
          LINKED=$($DOCKER exec moodle-connector-postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc \
            "SELECT count(*) FROM user_accounts WHERE \"ConnectorClientId\" IS NOT NULL AND btrim(\"ConnectorClientId\") <> '';")
          CONNECTIONS=$($DOCKER exec moodle-connector-postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc \
            'SELECT count(*) FROM connector_clients;')
          ALIASES=$($DOCKER exec moodle-connector-postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc \
            "SELECT COALESCE(string_agg(DISTINCT lower(btrim(\"MoodleAlias\")), ',' ORDER BY lower(btrim(\"MoodleAlias\"))), '') FROM connector_clients;")
          printf 'users=%s linkedAccounts=%s connections=%s aliases=%s\n' "$USERS" "$LINKED" "$CONNECTIONS" "$ALIASES"
          REMOTE
          )"

          if [ "$VPS_AUTH_MODE" = "key" ]; then
            printf '%s\n' "$REMOTE_SCRIPT" | ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              bash -s -- "$POSTGRES_USER" "$POSTGRES_DB"
          else
            printf '%s\n' "$REMOTE_SCRIPT" | sshpass -p "$VPS_AUTH_SECRET" ssh -p "$VPS_SSH_PORT" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              bash -s -- "$POSTGRES_USER" "$POSTGRES_DB"
          fi

      - name: Resolve the single account
        if: inputs.operation == 'link_goias_readonly'
        run: |
          set -euo pipefail
          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -euo pipefail
          POSTGRES_USER="$1"
          POSTGRES_DB="$2"
          DOCKER='docker'
          if ! docker info >/dev/null 2>&1; then DOCKER='sudo docker'; fi
          COUNT=$($DOCKER exec moodle-connector-postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc \
            'SELECT count(*) FROM user_accounts;')
          if [ "$COUNT" != '1' ]; then
            echo 'Expected exactly one application account; found a different count.' >&2
            exit 1
          fi
          $DOCKER exec moodle-connector-postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc \
            "SELECT COALESCE(NULLIF(\"ConnectorClientId\", ''), \"Id\"::text) FROM user_accounts LIMIT 1;"
          REMOTE
          )"

          if [ "$VPS_AUTH_MODE" = "key" ]; then
            CLIENT_ID="$(printf '%s\n' "$REMOTE_SCRIPT" | ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              bash -s -- "$POSTGRES_USER" "$POSTGRES_DB")"
          else
            CLIENT_ID="$(printf '%s\n' "$REMOTE_SCRIPT" | sshpass -p "$VPS_AUTH_SECRET" ssh -p "$VPS_SSH_PORT" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              bash -s -- "$POSTGRES_USER" "$POSTGRES_DB")"
          fi

          case "$CLIENT_ID" in
            ''|*[!a-zA-Z0-9._:-]*) echo "::error::Resolved client id is invalid" && exit 1 ;;
          esac
          echo "CLIENT_ID=$CLIENT_ID" >> "$GITHUB_ENV"
          echo "accountRef=$(printf '%s' "$CLIENT_ID" | sha256sum | cut -c1-12)"

      - name: Register Goiás as read-only
        if: inputs.operation == 'link_goias_readonly'
        env:
          TEMP_MOODLE_USERNAME: ${{ secrets.TEMP_MOODLE_USERNAME }}
          TEMP_MOODLE_PASSWORD: ${{ secrets.TEMP_MOODLE_PASSWORD }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          PAYLOAD_FILE="$(mktemp)"
          ADMIN_FILE="$(mktemp)"
          REMOTE_PAYLOAD="$VPS_APP_DIR/.maintenance-goias.json"
          REMOTE_ADMIN_KEY="$VPS_APP_DIR/.maintenance-admin-key"
          REMOTE_RESPONSE="$VPS_APP_DIR/.maintenance-response.json"

          cleanup() {
            rm -f "$PAYLOAD_FILE" "$ADMIN_FILE"
            if [ "${VPS_AUTH_MODE:-}" = "key" ]; then
              ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" \
                "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                rm -f "$REMOTE_PAYLOAD" "$REMOTE_ADMIN_KEY" "$REMOTE_RESPONSE" >/dev/null 2>&1 || true
            elif [ "${VPS_AUTH_MODE:-}" = "password" ]; then
              sshpass -p "$VPS_AUTH_SECRET" ssh -p "$VPS_SSH_PORT" \
                "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                rm -f "$REMOTE_PAYLOAD" "$REMOTE_ADMIN_KEY" "$REMOTE_RESPONSE" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          jq -cn \
            --arg clientId "$CLIENT_ID" \
            --arg username "$TEMP_MOODLE_USERNAME" \
            --arg password "$TEMP_MOODLE_PASSWORD" \
            '{
              clientId: $clientId,
              moodleAlias: "goias",
              moodleBaseUrl: "https://ead.fieg.com.br",
              moodleUsername: $username,
              moodlePassword: $password,
              moodleTarget: "goias",
              isDefault: true,
              canWrite: false
            }' > "$PAYLOAD_FILE"
          printf '%s' "$ADMIN_API_KEY" > "$ADMIN_FILE"
          chmod 600 "$PAYLOAD_FILE" "$ADMIN_FILE"

          if [ "$VPS_AUTH_MODE" = "key" ]; then
            scp -q -i ~/.ssh/deploy_key -P "$VPS_SSH_PORT" "$PAYLOAD_FILE" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$REMOTE_PAYLOAD"
            scp -q -i ~/.ssh/deploy_key -P "$VPS_SSH_PORT" "$ADMIN_FILE" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$REMOTE_ADMIN_KEY"
          else
            sshpass -p "$VPS_AUTH_SECRET" scp -q -P "$VPS_SSH_PORT" "$PAYLOAD_FILE" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$REMOTE_PAYLOAD"
            sshpass -p "$VPS_AUTH_SECRET" scp -q -P "$VPS_SSH_PORT" "$ADMIN_FILE" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$REMOTE_ADMIN_KEY"
          fi

          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -euo pipefail
          PAYLOAD="$1"
          ADMIN_KEY_FILE="$2"
          RESPONSE="$3"
          APP_PORT="$4"
          POSTGRES_USER="$5"
          POSTGRES_DB="$6"
          CLIENT_ID="$7"
          trap 'rm -f "$PAYLOAD" "$ADMIN_KEY_FILE" "$RESPONSE"' EXIT
          chmod 600 "$PAYLOAD" "$ADMIN_KEY_FILE"
          ADMIN_API_KEY="$(cat "$ADMIN_KEY_FILE")"
          STATUS=$(curl --silent --show-error --output "$RESPONSE" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H "X-Admin-Api-Key: $ADMIN_API_KEY" \
            --data-binary @"$PAYLOAD" \
            "http://127.0.0.1:$APP_PORT/admin/connector-clients/register")
          if [ "$STATUS" != '200' ]; then
            echo "Registration endpoint returned HTTP $STATUS" >&2
            exit 1
          fi

          DOCKER='docker'
          if ! docker info >/dev/null 2>&1; then DOCKER='sudo docker'; fi
          $DOCKER exec moodle-connector-postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c \
            "UPDATE user_accounts SET \"ConnectorClientId\" = '$CLIENT_ID', \"UpdatedAtUtc\" = now() WHERE \"Id\"::text = '$CLIENT_ID' OR \"ConnectorClientId\" = '$CLIENT_ID';" >/dev/null
          VERIFIED=$($DOCKER exec moodle-connector-postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc \
            "SELECT count(*) FROM connector_clients WHERE \"ClientId\" = '$CLIENT_ID' AND lower(btrim(\"MoodleAlias\")) = 'goias' AND \"IsActive\" AND NOT \"CanWrite\";")
          if [ "$VERIFIED" != '1' ]; then
            echo 'The read-only goias connection could not be verified.' >&2
            exit 1
          fi
          printf 'registered=true alias=goias canWrite=false\n'
          REMOTE
          )"
          if [ "$VPS_AUTH_MODE" = "key" ]; then
            printf '%s\n' "$REMOTE_SCRIPT" | ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              bash -s -- "$REMOTE_PAYLOAD" "$REMOTE_ADMIN_KEY" "$REMOTE_RESPONSE" \
              "$APP_PORT" "$POSTGRES_USER" "$POSTGRES_DB" "$CLIENT_ID"
          else
            printf '%s\n' "$REMOTE_SCRIPT" | sshpass -p "$VPS_AUTH_SECRET" ssh -p "$VPS_SSH_PORT" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              bash -s -- "$REMOTE_PAYLOAD" "$REMOTE_ADMIN_KEY" "$REMOTE_RESPONSE" \
              "$APP_PORT" "$POSTGRES_USER" "$POSTGRES_DB" "$CLIENT_ID"
          fi
