<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão de Correções</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f3f5;
  --bg-card:#ffffff;
  --bg-input:#f8f9fa;
  --border:#dee2e6;
  --border-focus:#1177d1;
  --text:#212529;
  --text-secondary:#495057;
  --text-muted:#868e96;
  --primary:#1177d1;
  --primary-dark:#0b5ea7;
  --primary-light:#d0ebff;
  --primary-lighter:#e7f5ff;
  --success:#2b8a3e;
  --success-light:#d3f9d8;
  --warning:#e67700;
  --warning-light:#fff3bf;
  --danger:#c92a2a;
  --danger-light:#ffe3e3;
  --radius:8px;
  --radius-sm:5px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow:0 1px 4px rgba(0,0,0,.08);
}
html{font-size:13px}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;line-height:1.55;padding:0;
}

/* ─── Top Bar ─── */
.topbar{
  background:var(--primary);
  padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
.topbar-left{display:flex;align-items:center;gap:10px}

.topbar-title{font-size:.9rem;font-weight:700;color:#fff}
.topbar-subtitle{font-size:.7rem;color:rgba(255,255,255,.75);margin-top:1px}
.topbar-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600;
  background:rgba(255,255,255,.2);color:#fff;
}

/* ─── Content ─── */
.content{max-width:640px;margin:0 auto;padding:16px 14px 80px}

/* ─── Student Card ─── */
.student-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:10px;box-shadow:var(--shadow-sm);overflow:hidden;
  transition:box-shadow .2s ease, border-color .2s ease;
}
.student-card:hover{box-shadow:var(--shadow);border-color:#adb5bd}
.student-card.sent{opacity:.6;pointer-events:none}
.student-card.sent .card-header::after{
  content:'Enviado ✓';position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:.65rem;font-weight:600;color:var(--success);
  background:var(--success-light);padding:2px 8px;border-radius:10px;
}
.student-card.send-error .card-header::after{
  content:'Falha ✗';position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:.65rem;font-weight:600;color:var(--danger);
  background:var(--danger-light);padding:2px 8px;border-radius:10px;
}

/* ─── Card checkbox ─── */
.card-checkbox{
  width:16px;height:16px;cursor:pointer;accent-color:var(--primary);
  flex-shrink:0;border-radius:3px;
}

.card-header{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;cursor:pointer;border-bottom:1px solid transparent;
  position:relative;transition:background .15s ease;
}
.card-header:hover{background:var(--primary-lighter)}
.student-card.open .card-header{border-bottom-color:var(--border)}

.avatar{
  width:32px;height:32px;border-radius:50%;
  background:var(--primary);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:.7rem;flex-shrink:0;
}
.student-name{font-weight:600;font-size:.82rem;color:var(--text)}
.student-meta{font-size:.68rem;color:var(--text-muted);margin-top:1px}
.card-header-right{margin-left:auto;display:flex;align-items:center;gap:8px}

.grade-badge{
  padding:3px 9px;border-radius:12px;font-size:.72rem;font-weight:700;
  white-space:nowrap;
}
.grade-badge.high{background:var(--success-light);color:var(--success)}
.grade-badge.mid{background:var(--warning-light);color:var(--warning)}
.grade-badge.low{background:var(--danger-light);color:var(--danger)}

.chevron{
  color:var(--text-muted);transition:transform .2s ease;font-size:.6rem;
}
.student-card.open .chevron{transform:rotate(90deg)}

/* ─── Card Body ─── */
.card-body{display:none;padding:14px;animation:fadeIn .2s ease}
.student-card.open .card-body{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.field-label{
  font-size:.65rem;font-weight:600;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;
}

.feedback-textarea{
  width:100%;min-height:110px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--bg-input);
  color:var(--text);padding:10px 12px;font-family:inherit;
  font-size:.8rem;line-height:1.6;resize:vertical;
  outline:none;transition:border-color .2s ease, box-shadow .2s ease;
}
.feedback-textarea:focus{
  border-color:var(--border-focus);
  box-shadow:0 0 0 2px rgba(17,119,209,.12);
  background:#fff;
}

.grade-row{
  display:flex;align-items:center;gap:8px;margin-top:10px;
}
.grade-field{
  width:70px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg-input);color:var(--text);padding:7px 10px;
  font-size:.85rem;font-weight:600;text-align:center;font-family:inherit;
  outline:none;transition:border-color .2s ease;
}
.grade-field:focus{border-color:var(--border-focus);box-shadow:0 0 0 2px rgba(17,119,209,.12);background:#fff}
.grade-max{font-size:.78rem;color:var(--text-muted);font-weight:500}

.char-count{font-size:.62rem;color:var(--text-muted);text-align:right;margin-top:3px}

/* ─── Bottom Bar ─── */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(255,255,255,.96);backdrop-filter:blur(6px);
  border-top:1px solid var(--border);
  padding:10px 20px;display:flex;align-items:center;justify-content:center;gap:12px;
  z-index:50;
}
.btn-send{
  padding:9px 28px;border-radius:var(--radius);border:none;
  background:var(--primary);color:#fff;font-size:.82rem;font-weight:600;
  cursor:pointer;font-family:inherit;
  transition:background .15s ease, transform .1s ease;
  box-shadow:0 1px 4px rgba(17,119,209,.2);
}
.btn-send:hover:not(:disabled){background:var(--primary-dark);transform:translateY(-1px)}
.btn-send:active:not(:disabled){transform:translateY(0)}
.btn-send:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-send-count{font-size:.7rem;color:var(--text-muted);font-weight:500}

/* ─── Confirm Modal ─── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(2px);
}
.modal-overlay.show{display:flex}
.modal{
  background:#fff;border-radius:var(--radius);padding:22px 26px;
  max-width:380px;width:92%;box-shadow:0 4px 16px rgba(0,0,0,.12);
}
.modal h2{font-size:.92rem;font-weight:700;color:var(--text);margin-bottom:6px}
.modal p{font-size:.8rem;color:var(--text-secondary);line-height:1.55;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.btn{
  padding:7px 16px;border-radius:var(--radius-sm);font-size:.78rem;font-weight:600;
  border:none;cursor:pointer;font-family:inherit;transition:all .15s ease;
}
.btn-cancel{background:var(--bg-input);color:var(--text-secondary);border:1px solid var(--border)}
.btn-cancel:hover{background:#e9ecef}
.btn-confirm{background:var(--primary);color:#fff}
.btn-confirm:hover:not(:disabled){background:var(--primary-dark)}
.btn-confirm:disabled{opacity:.5;cursor:not-allowed}

/* ─── Toast ─── */
.toast{
  position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-60px);
  padding:9px 18px;border-radius:var(--radius-sm);
  font-size:.78rem;font-weight:500;z-index:300;
  transition:transform .3s ease;box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast-success{background:var(--success);color:#fff}
.toast-error{background:var(--danger);color:#fff}
.toast-info{background:var(--primary);color:#fff}

/* ─── Loading ─── */
.skeleton{
  background:linear-gradient(90deg,#e9ecef 25%,#dee2e6 50%,#e9ecef 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius);
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-card{height:46px;margin-bottom:10px}

/* ─── Spinner ─── */
.loading-spinner-wrap{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 20px;gap:14px;
}
.loading-spinner{
  width:32px;height:32px;border:3px solid var(--border);
  border-top-color:var(--primary);border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:.8rem;color:var(--text-muted);font-weight:500}

/* ─── Empty ─── */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty-state p{font-size:.82rem;max-width:300px;margin:6px auto 0}

/* ─── No-feedback alert ─── */
.no-feedback-badge{
  font-size:.6rem;font-weight:600;padding:2px 6px;border-radius:8px;
  background:var(--warning-light);color:var(--warning);
  white-space:nowrap;flex-shrink:0;
}

/* ─── Responsive ─── */
@media(max-width:600px){
  .content{padding:12px 10px 80px}
  .topbar{padding:10px 14px}
}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-left">
    <div>
      <div class="topbar-title" id="page-title">Revisão de Correções</div>
      <div class="topbar-subtitle" id="page-subtitle">Confira e ajuste os feedbacks antes do envio</div>
    </div>
  </div>
  <span class="topbar-badge" id="topbar-count">
    <span id="count-label">0 alunos</span>
  </span>
</div>

<!-- Content -->
<div class="content">
  <!-- Loading -->
  <div id="loading">
    <div class="loading-spinner-wrap">
      <div class="loading-spinner"></div>
      <div class="loading-text">Carregando correções…</div>
    </div>
  </div>

  <!-- Student Cards -->
  <div id="cards-container" style="display:none"></div>

  <!-- Empty -->
  <div class="empty-state" id="empty-state" style="display:none">
    <p>Nenhuma correção disponível para revisão.</p>
  </div>
</div>

<!-- Bottom Bar -->
<div class="bottom-bar" id="bottom-bar" style="display:none">
  <span class="btn-send-count" id="send-count-label">0 alunos para enviar</span>
  <button class="btn-send" id="btn-send" disabled>Enviar Correções ao Moodle</button>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <h2>Confirmar envio</h2>
    <p>Você está prestes a enviar a nota e o feedback de <strong id="confirm-count">0</strong> aluno(s) para o Moodle. Deseja continuar?</p>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-confirm" id="btn-confirm" onclick="doSend()">Confirmar</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── State ───
const state = { batchJobId:null, items:[], pendingActionId:null, confirmationText:null, selectedIds:new Set() };
let rpcId = 0;
const pendingRpc = {};

// ─── MCP postMessage RPC ───
function callTool(name, args) {
  return new Promise((resolve, reject) => {
    // Prefer OpenAI Apps SDK bridge when running inside ChatGPT iframe
    if (window.openai && typeof window.openai.callTool === 'function') {
      window.openai.callTool(name, args).then(resolve).catch(reject);
      return;
    }
    // Fallback: raw JSON-RPC 2.0 postMessage for other MCP hosts
    const id = ++rpcId;
    pendingRpc[id] = { resolve, reject };
    window.parent.postMessage({ jsonrpc:"2.0", id, method:"tools/call", params:{ name, arguments:args } }, "*");
    setTimeout(() => { if (pendingRpc[id]) { delete pendingRpc[id]; reject(new Error("Timeout")); } }, 60000);
  });
}



// ─── Utils ───
function getFirstName(fullName) {
  if (!fullName) return null;
  const parts = fullName.trim().split(/\s+/);
  return parts[0] || null;
}

function personalizeGreeting(feedback, firstName) {
  if (!feedback || !firstName) return feedback;
  // Replace various greeting forms at the start with "Olá, Nome!"
  // Handles: "Olá!", "Olá.", "Olá,", "Olá ", "Olá" (end of string)
  return feedback.replace(/^Olá[!.,]?(?=\s|$)/, `Olá, ${firstName}!`);
}

// ─── Init ───
let initialized = false;

function loadData(data) {
  if (initialized) return;
  if (!data || !data.items || data.items.length === 0) return;
  initialized = true;
  state.batchJobId = data.batchJobId;
  state.items = data.items;
  state.courseName = data.courseName;
  renderAll();
}

function tryInit() {
  if (initialized) return true;

  // 1. OpenAI Apps SDK: data injected as window.openai.toolOutput by ChatGPT
  const openaiData = window.openai?.toolOutput?.data;
  if (openaiData && openaiData.items && openaiData.items.length > 0) {
    loadData(openaiData);
    return true;
  }

  // 2. Fallback: server-injected JSON in #init-data element
  const el = document.getElementById("init-data");
  if (el) {
    try {
      const data = JSON.parse(el.textContent);
      if (data && data.items && data.items.length > 0) {
        loadData(data);
        return true;
      }
    } catch(e) { /* will retry */ }
  }

  return false;
}

// Retry with exponential backoff (200ms, 400ms, 800ms, 1.6s, 3.2s)
// Handles cases where data arrives after DOMContentLoaded
function startRetryLoop() {
  if (tryInit()) return;
  let attempt = 0;
  const maxAttempts = 5;
  const retryTimer = setInterval(() => {
    attempt++;
    if (tryInit() || attempt >= maxAttempts) {
      clearInterval(retryTimer);
      if (!initialized) {
        // Show empty state after all retries exhausted
        document.getElementById("loading").style.display = "none";
        document.getElementById("empty-state").style.display = "";
      }
    }
  }, 200 * Math.pow(2, attempt));
}

// Listen for late-arriving data via postMessage (MCP hosts)
window.addEventListener("message", e => {
  const d = e.data;
  if (!d) return;

  // Handle JSON-RPC responses (existing)
  if (d.jsonrpc === "2.0" && d.id && pendingRpc[d.id]) {
    const { resolve, reject } = pendingRpc[d.id];
    delete pendingRpc[d.id];
    d.error ? reject(new Error(d.error.message || "Erro")) : resolve(d.result);
    return;
  }

  // Handle late data delivery from host
  if (d.type === "tool-output" && d.data) {
    loadData(d.data);
    return;
  }
  // Some hosts send structuredContent directly
  if (d.structuredContent?.data) {
    loadData(d.structuredContent.data);
    return;
  }
});

// Watch #init-data for mutations (in case server replaces it after load)
function watchInitData() {
  const el = document.getElementById("init-data");
  if (!el) return;
  const observer = new MutationObserver(() => {
    if (initialized) { observer.disconnect(); return; }
    try {
      const data = JSON.parse(el.textContent);
      if (data && data.items && data.items.length > 0) {
        loadData(data);
        observer.disconnect();
      }
    } catch(e) { /* ignore parse errors */ }
  });
  observer.observe(el, { childList: true, characterData: true, subtree: true });
}

// ─── Render ───
function renderAll() {
  document.getElementById("loading").style.display = "none";
  document.getElementById("empty-state").style.display = "none";
  const container = document.getElementById("cards-container");
  container.style.display = "";
  container.innerHTML = "";
  // Reset selection on each render (all cards start checked = all selected by default)
  state.selectedIds.clear();

  if (state.items.length === 0) {
    document.getElementById("empty-state").style.display = "";
    return;
  }

  // Update topbar with course name and batch progress
  const readyItems  = state.items.filter(i => i.draftFeedback || i.finalFeedback).length;
  const totalItems  = state.items.length;
  const allReady    = readyItems === totalItems;

  if (state.courseName) {
    document.getElementById("page-subtitle").textContent = state.courseName;
  }

  const statusLabel = allReady
    ? totalItems + " aluno" + (totalItems !== 1 ? "s" : "") + " prontos"
    : readyItems + " / " + totalItems + " prontos";
  document.getElementById("count-label").textContent = statusLabel;

  document.getElementById("bottom-bar").style.display = "";
  updateSendButton();

  state.items.forEach((item, idx) => {
    const firstName = getFirstName(item.studentName);
    const displayName = firstName || item.studentName || ("Aluno " + item.studentId);
    const initials = getInitials(item.studentId, item.studentName);
    // CRITICAL: prioritize final over suggested
    const displayGrade = item.finalGrade ?? item.suggestedGrade;
    const grade = displayGrade != null ? Number(displayGrade).toFixed(1) : "—";
    const max = item.maxGrade ? Number(item.maxGrade).toFixed(0) : "100";
    const gradeClass = getGradeClass(displayGrade, item.maxGrade);
    let feedback = item.finalFeedback || item.draftFeedback || "";
    const hasFeedback = feedback.trim().length > 0;

    // Personalize the greeting with student's first name
    if (firstName) {
      feedback = personalizeGreeting(feedback, firstName);
    }

    // Assignment name instead of file name
    const metaText = item.assignmentName ? item.assignmentName : ('Atividade ' + item.assignmentId);

    // No-feedback badge
    const noFeedbackBadge = !hasFeedback
      ? `<span class="no-feedback-badge">Sem feedback</span>`
      : '';

    const card = document.createElement("div");
    card.className = "student-card";
    card.id = "card-"+item.gradingItemId;
    card.innerHTML = `
      <div class="card-header" onclick="toggle('${item.gradingItemId}')">
        <input type="checkbox" class="card-checkbox" id="chk-${item.gradingItemId}"
          checked onclick="event.stopPropagation()"
          onchange="toggleSelect('${item.gradingItemId}', this.checked)">
        <div class="avatar">${esc(initials)}</div>
        <div>
          <div class="student-name">${esc(displayName)}</div>
          <div class="student-meta">${esc(metaText)}</div>
        </div>
        <div class="card-header-right">
          ${noFeedbackBadge}
          <span class="grade-badge ${gradeClass}" id="badge-${item.gradingItemId}">${grade} / ${max}</span>
          <span class="chevron">▶</span>
        </div>
      </div>
      <div class="card-body">
        <div class="field-label">Feedback para o aluno</div>
        <textarea class="feedback-textarea" id="fb-${item.gradingItemId}"
          oninput="onEdit('${item.gradingItemId}')"
          placeholder="Escreva o feedback para o aluno...">${esc(feedback)}</textarea>
        <div class="char-count" id="cc-${item.gradingItemId}">${feedback.length} caracteres</div>

        <div class="grade-row">
          <div>
            <div class="field-label" style="margin-bottom:3px">Nota</div>
            <input type="number" class="grade-field" id="grade-${item.gradingItemId}"
              value="${displayGrade ?? ''}" step="0.1" min="0" max="${max}"
              oninput="onGradeEdit('${item.gradingItemId}')">
          </div>
          <span class="grade-max" style="margin-top:16px">/ ${max}</span>
        </div>
      </div>`;
    container.appendChild(card);
  });

  // Auto-open card when there is only one student
  if (state.items.length === 1) {
    const onlyCard = document.getElementById("card-" + state.items[0].gradingItemId);
    if (onlyCard) onlyCard.classList.add("open");
  }
}

function getInitials(id, name) {
  if (name) {
    const parts = name.trim().split(/\s+/);
    if (parts.length >= 2) return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
    return parts[0].substring(0,2).toUpperCase();
  }
  return String(id).substring(0,2);
}

function getGradeClass(grade, max) {
  if (grade==null||max==null||max===0) return "mid";
  const r = grade/max;
  if (r>=0.7) return "high";
  if (r>=0.4) return "mid";
  return "low";
}

// ─── Interactions ───
function toggle(id) {
  const card = document.getElementById("card-"+id);
  card.classList.toggle("open");
}

function onEdit(id) {
  const fb = document.getElementById("fb-"+id);
  document.getElementById("cc-"+id).textContent = fb.value.length + " caracteres";
}

function onGradeEdit(id) {
  const gradeEl = document.getElementById("grade-"+id);
  const val = parseFloat(gradeEl.value);
  const item = state.items.find(i=>i.gradingItemId===id);
  const max = item?.maxGrade || 100;
  const badge = document.getElementById("badge-"+id);
  if (!isNaN(val)) {
    badge.textContent = val.toFixed(1)+" / "+Number(max).toFixed(0);
    badge.className = "grade-badge " + getGradeClass(val, max);
  }
}

function toggleSelect(id, checked) {
  if (checked) {
    state.selectedIds.add(id);
  } else {
    state.selectedIds.delete(id);
  }
  updateSendButton();
}

function updateSendButton() {
  const n = state.selectedIds.size > 0 ? state.selectedIds.size : state.items.length;
  const label = state.selectedIds.size > 0
    ? n + " selecionado" + (n!==1?"s":"")
    : n + " aluno" + (n!==1?"s":"")+" para enviar";
  document.getElementById("send-count-label").textContent = label;
  document.getElementById("btn-send").disabled = state.items.length === 0;
}

// ─── Send Flow ───
document.getElementById("btn-send").addEventListener("click", async ()=>{
  const btn = document.getElementById("btn-send");
  btn.disabled = true;
  btn.textContent = "Salvando rascunhos...";

  // Only send selected items; fall back to all if none explicitly selected
  const toSend = state.selectedIds.size > 0
    ? state.items.filter(i => state.selectedIds.has(i.gradingItemId))
    : state.items;

  let savedCount = 0;
  const savedIds = [];
  for (const item of toSend) {
    const fb = document.getElementById("fb-"+item.gradingItemId)?.value || "";
    const gr = document.getElementById("grade-"+item.gradingItemId)?.value;
    try {
      await callTool("atualizar_rascunho_correcao", {
        gradingItemId: item.gradingItemId,
        finalGrade: gr ? parseFloat(gr) : null,
        finalFeedback: fb,
        teacherDecision: "approved",
        expectedReviewStatus: item.reviewStatus || "NotReviewed"
      });
      savedCount++;
      savedIds.push(item.gradingItemId);
    } catch(e) {
      toast("Erro ao salvar "+getDisplayName(item)+": "+e.message, "error");
    }
  }

  if (savedCount === 0) {
    toast("Nenhum item foi salvo.", "error");
    btn.disabled = false;
    btn.textContent = "Enviar Correções ao Moodle";
    return;
  }

  // Create preview — pass only the saved item IDs
  btn.textContent = "Preparando envio...";
  try {
    const result = await callTool("criar_previa_lancamento_lote", {
      batchJobId: state.batchJobId,
      gradingItemIds: savedIds,
      onlyReviewed: true
    });
    const data = extractData(result);
    if (data && data.pendingActionId && data.pendingActionId !== "00000000-0000-0000-0000-000000000000") {
      state.pendingActionId = data.pendingActionId;
      state.confirmationText = data.confirmationText;
      document.getElementById("confirm-count").textContent = data.readyItems || savedCount;
      document.getElementById("confirm-modal").classList.add("show");
    } else {
      toast("Não foi possível preparar o envio. Verifique se os itens têm nota e feedback.", "error");
    }
  } catch(e) {
    toast("Erro ao preparar: "+e.message, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Enviar Correções ao Moodle";
  }
});

function closeModal() {
  document.getElementById("confirm-modal").classList.remove("show");
}

async function doSend() {
  const btn = document.getElementById("btn-confirm");
  btn.disabled = true;
  btn.textContent = "Enviando...";
  try {
    const result = await callTool("confirmar_lancamento_lote_moodle", {
      pendingActionId: state.pendingActionId,
      confirmationText: state.confirmationText
    });
    const data = extractData(result);
    closeModal();
    if (data) {
      const ok = data.sentItems || 0;
      const fail = data.failedItems || 0;

      // Build a set of failed gradingItemIds for per-card marking
      const failedIds = new Set(
        (data.failures || []).map(f => f.gradingItemId)
      );

      // Mark cards individually: sent = green, failed = red
      state.items.forEach(i => {
        const c = document.getElementById("card-"+i.gradingItemId);
        if (!c) return;
        if (failedIds.has(i.gradingItemId)) {
          c.classList.add("send-error");
        } else {
          // Only mark as sent if we were trying to send this item
          const wasSending = state.selectedIds.size === 0 || state.selectedIds.has(i.gradingItemId);
          if (wasSending) c.classList.add("sent");
        }
      });

      if (fail > 0 && ok === 0) {
        toast("Falha no envio: "+fail+" item(ns) não foram enviados.", "error");
      } else if (fail > 0) {
        toast(ok+" enviado(s) com sucesso, "+fail+" com falha. Verifique os cards marcados.", "error");
        document.getElementById("btn-send").textContent = "Retentar falhas";
      } else {
        toast("Correções enviadas com sucesso! ("+ok+" aluno"+(ok!==1?"s":"")+")", "success");
        document.getElementById("btn-send").disabled = true;
        document.getElementById("btn-send").textContent = "Enviado ✓";
      }
    } else {
      toast("Envio concluído.", "success");
    }
  } catch(e) {
    toast("Erro no envio: "+e.message, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Confirmar";
  }
}

// ─── Utils ───
function extractData(result) {
  if (!result) return null;
  if (result.structuredContent?.data) return result.structuredContent.data;
  if (result.data) return result.data;
  if (result.content?.[0]?.text) { try { return JSON.parse(result.content[0].text).data; } catch {} }
  return result;
}

function getDisplayName(item) {
  const firstName = getFirstName(item.studentName);
  return firstName || item.studentName || ("Aluno "+item.studentId);
}

function esc(s) {
  if (!s) return "";
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function toast(msg, type) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast toast-"+type+" show";
  setTimeout(()=> el.classList.remove("show"), 4500);
}

// ─── Boot ───
document.addEventListener("DOMContentLoaded", () => {
  startRetryLoop();
  watchInitData();
});
</script>

<!-- Server-injected data -->
<script type="application/json" id="init-data">{"batchJobId":null,"items":[],"totalItems":0,"readyItems":0,"blockedItems":0,"failedItems":0}</script>
