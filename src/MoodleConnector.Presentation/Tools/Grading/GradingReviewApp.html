<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão de Correções</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f9fc;
  --bg-card:#ffffff;
  --bg-input:#f1f3f8;
  --border:#e2e5ed;
  --border-focus:#2563eb;
  --text:#1e293b;
  --text-secondary:#475569;
  --text-muted:#94a3b8;
  --primary:#1d4ed8;
  --primary-hover:#1e40af;
  --primary-light:#dbeafe;
  --primary-lighter:#eff6ff;
  --success:#16a34a;
  --success-light:#dcfce7;
  --warning:#ca8a04;
  --warning-light:#fef9c3;
  --danger:#dc2626;
  --danger-light:#fee2e2;
  --radius:10px;
  --radius-sm:6px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06);
  --shadow:0 2px 8px rgba(0,0,0,.08);
  --shadow-lg:0 4px 16px rgba(0,0,0,.1);
}
html{font-size:15px}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;line-height:1.6;padding:0;
}

/* ─── Top Bar ─── */
.topbar{
  background:#ffffff;
  border-bottom:1px solid var(--border);
  padding:18px 28px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar-logo{
  width:36px;height:36px;border-radius:8px;
  background:var(--primary);display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:1rem;
}
.topbar-title{font-size:1.05rem;font-weight:700;color:var(--text)}
.topbar-subtitle{font-size:.78rem;color:var(--text-muted);margin-top:1px}
.topbar-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 14px;border-radius:20px;font-size:.75rem;font-weight:600;
  background:var(--primary-light);color:var(--primary);
}

/* ─── Content ─── */
.content{max-width:780px;margin:0 auto;padding:24px 20px 100px}

/* ─── Summary ─── */
.summary{
  display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;
}
.summary-item{
  flex:1;min-width:120px;
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;text-align:center;box-shadow:var(--shadow-sm);
}
.summary-value{font-size:1.6rem;font-weight:700;color:var(--primary)}
.summary-label{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}

/* ─── Student Card ─── */
.student-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:14px;box-shadow:var(--shadow-sm);overflow:hidden;
  transition:box-shadow .2s ease, border-color .2s ease;
}
.student-card:hover{box-shadow:var(--shadow);border-color:#cbd5e1}
.student-card.sent{opacity:.65;pointer-events:none}
.student-card.sent .card-header::after{
  content:'Enviado ✓';position:absolute;right:16px;top:50%;transform:translateY(-50%);
  font-size:.75rem;font-weight:600;color:var(--success);
  background:var(--success-light);padding:3px 10px;border-radius:12px;
}

.card-header{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;cursor:pointer;border-bottom:1px solid transparent;
  position:relative;transition:background .15s ease;
}
.card-header:hover{background:var(--primary-lighter)}
.student-card.open .card-header{border-bottom-color:var(--border)}

.avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:.85rem;flex-shrink:0;
}
.student-name{font-weight:600;font-size:.92rem;color:var(--text)}
.student-meta{font-size:.75rem;color:var(--text-muted);margin-top:1px}
.card-header-right{margin-left:auto;display:flex;align-items:center;gap:10px}

.grade-badge{
  padding:4px 12px;border-radius:16px;font-size:.82rem;font-weight:700;
  white-space:nowrap;
}
.grade-badge.high{background:var(--success-light);color:var(--success)}
.grade-badge.mid{background:var(--warning-light);color:var(--warning)}
.grade-badge.low{background:var(--danger-light);color:var(--danger)}

.chevron{
  color:var(--text-muted);transition:transform .2s ease;font-size:.7rem;
}
.student-card.open .chevron{transform:rotate(90deg)}

/* ─── Card Body ─── */
.card-body{display:none;padding:18px;animation:fadeIn .2s ease}
.student-card.open .card-body{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.field-label{
  font-size:.72rem;font-weight:600;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;
}

.feedback-textarea{
  width:100%;min-height:130px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--bg-input);
  color:var(--text);padding:12px 14px;font-family:inherit;
  font-size:.88rem;line-height:1.65;resize:vertical;
  outline:none;transition:border-color .2s ease, box-shadow .2s ease;
}
.feedback-textarea:focus{
  border-color:var(--border-focus);
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
  background:#fff;
}

.grade-row{
  display:flex;align-items:center;gap:10px;margin-top:14px;
}
.grade-field{
  width:80px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg-input);color:var(--text);padding:9px 12px;
  font-size:.95rem;font-weight:600;text-align:center;font-family:inherit;
  outline:none;transition:border-color .2s ease;
}
.grade-field:focus{border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(37,99,235,.12);background:#fff}
.grade-max{font-size:.85rem;color:var(--text-muted);font-weight:500}

.char-count{font-size:.7rem;color:var(--text-muted);text-align:right;margin-top:4px}

/* ─── Bottom Bar ─── */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
  border-top:1px solid var(--border);
  padding:14px 28px;display:flex;align-items:center;justify-content:center;gap:16px;
  z-index:50;
}
.btn-send{
  padding:12px 36px;border-radius:var(--radius);border:none;
  background:var(--primary);color:#fff;font-size:.92rem;font-weight:600;
  cursor:pointer;font-family:inherit;
  transition:background .15s ease, transform .1s ease, box-shadow .15s ease;
  box-shadow:0 2px 8px rgba(29,78,216,.25);
}
.btn-send:hover:not(:disabled){background:var(--primary-hover);transform:translateY(-1px);box-shadow:0 4px 14px rgba(29,78,216,.3)}
.btn-send:active:not(:disabled){transform:translateY(0)}
.btn-send:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-send-count{font-size:.78rem;color:var(--text-muted);font-weight:500}

/* ─── Confirm Modal ─── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:200;display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(3px);
}
.modal-overlay.show{display:flex}
.modal{
  background:#fff;border-radius:var(--radius);padding:28px 32px;
  max-width:420px;width:92%;box-shadow:var(--shadow-lg);
}
.modal h2{font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:8px}
.modal p{font-size:.88rem;color:var(--text-secondary);line-height:1.6;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.btn{
  padding:9px 20px;border-radius:var(--radius-sm);font-size:.85rem;font-weight:600;
  border:none;cursor:pointer;font-family:inherit;transition:all .15s ease;
}
.btn-cancel{background:var(--bg-input);color:var(--text-secondary);border:1px solid var(--border)}
.btn-cancel:hover{background:#e8eaef}
.btn-confirm{background:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(29,78,216,.2)}
.btn-confirm:hover:not(:disabled){background:var(--primary-hover)}
.btn-confirm:disabled{opacity:.5;cursor:not-allowed}

/* ─── Toast ─── */
.toast{
  position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-80px);
  padding:12px 24px;border-radius:var(--radius-sm);
  font-size:.85rem;font-weight:500;z-index:300;
  transition:transform .3s ease;box-shadow:var(--shadow-lg);
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast-success{background:var(--success);color:#fff}
.toast-error{background:var(--danger);color:#fff}
.toast-info{background:var(--primary);color:#fff}

/* ─── Loading ─── */
.skeleton{
  background:linear-gradient(90deg,var(--bg-input) 25%,#e8eaef 50%,var(--bg-input) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius);
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-card{height:56px;margin-bottom:12px}

/* ─── Empty ─── */
.empty-state{text-align:center;padding:60px 24px;color:var(--text-muted)}
.empty-state p{font-size:.92rem;max-width:340px;margin:8px auto 0}

/* ─── Responsive ─── */
@media(max-width:600px){
  .content{padding:16px 12px 100px}
  .topbar{padding:14px 16px}
  .summary-item{min-width:80px;padding:10px 12px}
  .summary-value{font-size:1.3rem}
}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">EA</div>
    <div>
      <div class="topbar-title" id="page-title">Revisão de Correções</div>
      <div class="topbar-subtitle" id="page-subtitle">Confira e ajuste os feedbacks antes do envio</div>
    </div>
  </div>
  <span class="topbar-badge" id="topbar-count">
    <span id="count-label">0 alunos</span>
  </span>
</div>

<!-- Content -->
<div class="content">
  <!-- Summary -->
  <div class="summary" id="summary" style="display:none">
    <div class="summary-item">
      <div class="summary-value" id="s-total">0</div>
      <div class="summary-label">Alunos</div>
    </div>
    <div class="summary-item">
      <div class="summary-value" id="s-avg" style="color:var(--success)">—</div>
      <div class="summary-label">Média</div>
    </div>
    <div class="summary-item">
      <div class="summary-value" id="s-max" style="color:var(--text-secondary)">—</div>
      <div class="summary-label">Nota máx.</div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
  </div>

  <!-- Student Cards -->
  <div id="cards-container" style="display:none"></div>

  <!-- Empty -->
  <div class="empty-state" id="empty-state" style="display:none">
    <p>Nenhuma correção disponível para revisão.</p>
  </div>
</div>

<!-- Bottom Bar -->
<div class="bottom-bar" id="bottom-bar" style="display:none">
  <span class="btn-send-count" id="send-count-label">0 alunos para enviar</span>
  <button class="btn-send" id="btn-send" disabled>Enviar Correções ao Moodle</button>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <h2>Confirmar envio</h2>
    <p>Você está prestes a enviar a nota e o feedback de <strong id="confirm-count">0</strong> aluno(s) para o Moodle. Deseja continuar?</p>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-confirm" id="btn-confirm" onclick="doSend()">Confirmar</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── State ───
const state = { batchJobId:null, items:[], pendingActionId:null, confirmationText:null };
let rpcId = 0;
const pendingRpc = {};

// ─── MCP postMessage RPC ───
function callTool(name, args) {
  return new Promise((resolve, reject) => {
    const id = ++rpcId;
    pendingRpc[id] = { resolve, reject };
    window.parent.postMessage({ jsonrpc:"2.0", id, method:"tools/call", params:{ name, arguments:args } }, "*");
    setTimeout(() => { if (pendingRpc[id]) { delete pendingRpc[id]; reject(new Error("Timeout")); } }, 30000);
  });
}
window.addEventListener("message", e => {
  const d = e.data;
  if (d && d.jsonrpc==="2.0" && d.id && pendingRpc[d.id]) {
    const { resolve, reject } = pendingRpc[d.id];
    delete pendingRpc[d.id];
    d.error ? reject(new Error(d.error.message||"Erro")) : resolve(d.result);
  }
});

// ─── Init ───
function init() {
  const el = document.getElementById("init-data");
  if (!el) return;
  try {
    const data = JSON.parse(el.textContent);
    state.batchJobId = data.batchJobId;
    state.items = data.items || [];
    renderAll();
  } catch(e) {
    toast("Erro ao carregar dados: "+e.message, "error");
  }
}

// ─── Render ───
function renderAll() {
  document.getElementById("loading").style.display = "none";
  const container = document.getElementById("cards-container");
  container.style.display = "";
  container.innerHTML = "";

  if (state.items.length === 0) {
    document.getElementById("empty-state").style.display = "";
    return;
  }

  // Summary
  const sumEl = document.getElementById("summary");
  sumEl.style.display = "";
  document.getElementById("s-total").textContent = state.items.length;
  const grades = state.items.filter(i => i.suggestedGrade != null).map(i => Number(i.suggestedGrade));
  if (grades.length > 0) {
    const avg = (grades.reduce((a,b)=>a+b,0)/grades.length).toFixed(1);
    document.getElementById("s-avg").textContent = avg;
  }
  const maxG = state.items[0]?.maxGrade;
  if (maxG) document.getElementById("s-max").textContent = Number(maxG).toFixed(0);

  document.getElementById("count-label").textContent = state.items.length + " aluno" + (state.items.length!==1?"s":"");
  document.getElementById("bottom-bar").style.display = "";
  updateSendButton();

  state.items.forEach((item, idx) => {
    const initials = getInitials(item.studentId, item.studentName);
    const displayName = item.studentName || ("Aluno " + item.studentId);
    const grade = item.suggestedGrade != null ? Number(item.suggestedGrade).toFixed(1) : "—";
    const max = item.maxGrade ? Number(item.maxGrade).toFixed(0) : "100";
    const gradeClass = getGradeClass(item.suggestedGrade, item.maxGrade);
    const feedback = item.draftFeedback || "";

    const card = document.createElement("div");
    card.className = "student-card";
    card.id = "card-"+item.gradingItemId;
    card.innerHTML = `
      <div class="card-header" onclick="toggle('${item.gradingItemId}')">
        <div class="avatar">${esc(initials)}</div>
        <div>
          <div class="student-name">${esc(displayName)}</div>
          <div class="student-meta">${item.assignmentName ? esc(item.assignmentName) : 'Atividade '+item.assignmentId}</div>
        </div>
        <div class="card-header-right">
          <span class="grade-badge ${gradeClass}" id="badge-${item.gradingItemId}">${grade} / ${max}</span>
          <span class="chevron">▶</span>
        </div>
      </div>
      <div class="card-body">
        <div class="field-label">Feedback para o aluno</div>
        <textarea class="feedback-textarea" id="fb-${item.gradingItemId}"
          oninput="onEdit('${item.gradingItemId}')"
          placeholder="Escreva o feedback para o aluno...">${esc(feedback)}</textarea>
        <div class="char-count" id="cc-${item.gradingItemId}">${feedback.length} caracteres</div>

        <div class="grade-row">
          <div>
            <div class="field-label" style="margin-bottom:4px">Nota</div>
            <input type="number" class="grade-field" id="grade-${item.gradingItemId}"
              value="${item.suggestedGrade ?? ''}" step="0.1" min="0" max="${max}"
              oninput="onGradeEdit('${item.gradingItemId}')">
          </div>
          <span class="grade-max" style="margin-top:20px">/ ${max}</span>
        </div>
      </div>`;
    container.appendChild(card);
  });
}

function getInitials(id, name) {
  if (name) {
    const parts = name.trim().split(/\s+/);
    if (parts.length >= 2) return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
    return parts[0].substring(0,2).toUpperCase();
  }
  return String(id).substring(0,2);
}

function getGradeClass(grade, max) {
  if (grade==null||max==null||max===0) return "mid";
  const r = grade/max;
  if (r>=0.7) return "high";
  if (r>=0.4) return "mid";
  return "low";
}

// ─── Interactions ───
function toggle(id) {
  const card = document.getElementById("card-"+id);
  card.classList.toggle("open");
}

function onEdit(id) {
  const fb = document.getElementById("fb-"+id);
  document.getElementById("cc-"+id).textContent = fb.value.length + " caracteres";
}

function onGradeEdit(id) {
  const gradeEl = document.getElementById("grade-"+id);
  const val = parseFloat(gradeEl.value);
  const item = state.items.find(i=>i.gradingItemId===id);
  const max = item?.maxGrade || 100;
  const badge = document.getElementById("badge-"+id);
  if (!isNaN(val)) {
    badge.textContent = val.toFixed(1)+" / "+Number(max).toFixed(0);
    badge.className = "grade-badge " + getGradeClass(val, max);
  }
}

function updateSendButton() {
  const n = state.items.length;
  document.getElementById("send-count-label").textContent =
    n + " aluno"+(n!==1?"s":"")+" para enviar";
  document.getElementById("btn-send").disabled = n===0;
}

// ─── Send Flow ───
document.getElementById("btn-send").addEventListener("click", async ()=>{
  // Save all drafts first
  const btn = document.getElementById("btn-send");
  btn.disabled = true;
  btn.textContent = "Salvando rascunhos...";

  let savedCount = 0;
  for (const item of state.items) {
    const fb = document.getElementById("fb-"+item.gradingItemId)?.value || "";
    const gr = document.getElementById("grade-"+item.gradingItemId)?.value;
    try {
      await callTool("atualizar_rascunho_correcao", {
        gradingItemId: item.gradingItemId,
        finalGrade: gr ? parseFloat(gr) : null,
        finalFeedback: fb,
        teacherDecision: "approved",
        expectedReviewStatus: "NotReviewed"
      });
      savedCount++;
    } catch(e) {
      toast("Erro ao salvar "+getDisplayName(item)+": "+e.message, "error");
    }
  }

  if (savedCount === 0) {
    toast("Nenhum item foi salvo.", "error");
    btn.disabled = false;
    btn.textContent = "Enviar Correções ao Moodle";
    return;
  }

  // Create preview
  btn.textContent = "Preparando envio...";
  try {
    const result = await callTool("criar_previa_lancamento_lote", {
      batchJobId: state.batchJobId,
      onlyReviewed: true
    });
    const data = extractData(result);
    if (data && data.pendingActionId && data.pendingActionId !== "00000000-0000-0000-0000-000000000000") {
      state.pendingActionId = data.pendingActionId;
      state.confirmationText = data.confirmationText;
      document.getElementById("confirm-count").textContent = data.readyItems || savedCount;
      document.getElementById("confirm-modal").classList.add("show");
    } else {
      toast("Não foi possível preparar o envio.", "error");
    }
  } catch(e) {
    toast("Erro ao preparar: "+e.message, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Enviar Correções ao Moodle";
  }
});

function closeModal() {
  document.getElementById("confirm-modal").classList.remove("show");
}

async function doSend() {
  const btn = document.getElementById("btn-confirm");
  btn.disabled = true;
  btn.textContent = "Enviando...";
  try {
    const result = await callTool("confirmar_lancamento_lote_moodle", {
      pendingActionId: state.pendingActionId,
      confirmationText: state.confirmationText
    });
    const data = extractData(result);
    closeModal();
    if (data) {
      const ok = data.sentItems || 0;
      const fail = data.failedItems || 0;
      if (fail > 0) {
        toast(ok+" enviado(s), "+fail+" com falha.", "error");
      } else {
        toast("Correções enviadas com sucesso! ("+ok+" aluno"+(ok!==1?"s":"")+")", "success");
        // Mark all cards as sent
        state.items.forEach(i => {
          const c = document.getElementById("card-"+i.gradingItemId);
          if (c) c.classList.add("sent");
        });
        document.getElementById("btn-send").disabled = true;
        document.getElementById("btn-send").textContent = "Enviado ✓";
      }
    } else {
      toast("Envio concluído.", "success");
    }
  } catch(e) {
    toast("Erro no envio: "+e.message, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Confirmar";
  }
}

// ─── Utils ───
function extractData(result) {
  if (!result) return null;
  if (result.structuredContent?.data) return result.structuredContent.data;
  if (result.data) return result.data;
  if (result.content?.[0]?.text) { try { return JSON.parse(result.content[0].text).data; } catch {} }
  return result;
}

function getDisplayName(item) {
  return item.studentName || ("Aluno "+item.studentId);
}

function esc(s) {
  if (!s) return "";
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function toast(msg, type) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast toast-"+type+" show";
  setTimeout(()=> el.classList.remove("show"), 4500);
}

// ─── Boot ───
document.addEventListener("DOMContentLoaded", init);
</script>

<!-- Server-injected data -->
<script type="application/json" id="init-data">{"batchJobId":null,"items":[],"totalItems":0,"readyItems":0,"blockedItems":0,"failedItems":0}</script>
</body>
</html>
